# Builds Hamyar for phones every time hamyar-source.zip changes in this repository:
#   - iPhone (and any phone browser): the installable web app on GitHub Pages
#   - Android: a signed APK, attached to the newest GitHub Release
# The two parts are separate jobs, so the iPhone web app is published even when the Android build fails.
# When a step fails, its key lines are shown as a red message on the run summary page.
# Setup steps are in the Persian guide (00-Guide.html) that came with this file.
name: Build Hamyar for phones

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hamyar-build
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Unpack the source
        run: |
          ZIP="hamyar-source.zip"
          if [ ! -f "$ZIP" ]; then ZIP="$(find . -maxdepth 1 -name '*.zip' | head -n 1)"; fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error title=hamyar-source.zip is missing::Upload hamyar-source.zip to this repository (Add file, then Upload files), then run this workflow again."
            exit 1
          fi
          echo "Using $ZIP"
          unzip -q "$ZIP" -d unpacked
          PKG="$(find unpacked -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n 1)"
          if [ -z "$PKG" ]; then
            echo "::error title=The zip file looks wrong::No package.json was found inside $ZIP. Upload the original hamyar-source.zip from the kit, unchanged."
            exit 1
          fi
          SRC="$(dirname "$PKG")"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "Source folder: $SRC"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install and run the tests
        working-directory: ${{ env.SRC }}
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Build the phone web app
        working-directory: ${{ env.SRC }}
        run: npm run build:mobile

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SRC }}/dist-mobile

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the web app
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show the iPhone address
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### Hamyar on iPhone"
            echo "Open this address in Safari, then choose Share and Add to Home Screen:"
            echo
            echo "$PAGE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Unpack the source
        run: |
          ZIP="hamyar-source.zip"
          if [ ! -f "$ZIP" ]; then ZIP="$(find . -maxdepth 1 -name '*.zip' | head -n 1)"; fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error title=hamyar-source.zip is missing::Upload hamyar-source.zip to this repository (Add file, then Upload files), then run this workflow again."
            exit 1
          fi
          unzip -q "$ZIP" -d unpacked
          PKG="$(find unpacked -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n 1)"
          if [ -z "$PKG" ]; then
            echo "::error title=The zip file looks wrong::No package.json was found inside $ZIP. Upload the original hamyar-source.zip from the kit, unchanged."
            exit 1
          fi
          SRC="$(dirname "$PKG")"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Add the helper that reports failures
        run: |
          cat > "$RUNNER_TEMP/hamyar-ci.sh" <<'EOF'
          # Runs a command and shows its output as usual. When it fails, the key lines are also
          # added as a red message on the run summary page, so the reason is visible at a glance.
          excerpt_of() {
            local log="$1"
            # compiler / resource errors are printed earlier than Gradle's own summary
            grep -E 'error:|AAPT|ERROR' "$log" | grep -v 'add-mask' | head -n 6
            if grep -q 'What went wrong' "$log"; then
              grep -A12 'What went wrong' "$log" | head -n 18
            else
              grep -vE '^[[:space:]]*$|add-mask' "$log" | tail -n 16
            fi
          }

          annotate_error() {
            # $1 = title, stdin = message; encoded as a GitHub workflow command
            local text
            text="$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print substr($0, 1, 260) }')"
            echo "::error title=$1::${text}"
          }

          logged() {
            local title="$1"
            shift
            local log
            log="$(mktemp)"
            set +e
            "$@" 2>&1 | tee "$log"
            local status="${PIPESTATUS[0]}"
            set -e
            if [ "$status" -ne 0 ]; then
              excerpt_of "$log" | annotate_error "$title failed"
            fi
            rm -f "$log"
            return "$status"
          }
          EOF

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install and build the web app
        working-directory: ${{ env.SRC }}
        run: |
          npm ci --no-audit --no-fund
          npm run build:mobile

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare the Android project
        working-directory: ${{ env.SRC }}
        run: |
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/hamyar-ci.sh"
          logged "Android project sync" npx cap sync android

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.HAMYAR_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.HAMYAR_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/hamyar.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$KEYSTORE" 2>/dev/null; then
              echo "::error title=Signing key (HAMYAR_KEYSTORE)::The HAMYAR_KEYSTORE secret is not valid text. Delete it and paste the whole content of 3-secret-HAMYAR_KEYSTORE.txt again."
              exit 1
            fi
            if ! keytool -list -keystore "$KEYSTORE" -storepass:env KEYSTORE_PASSWORD -alias hamyar > /dev/null 2>&1; then
              echo "::error title=Signing key (password or key text)::The key (HAMYAR_KEYSTORE) cannot be opened with the password (HAMYAR_KEYSTORE_PASSWORD). Either the password is wrong or the key text was pasted incompletely. Paste both again from files 3 and 4, and check that they are not swapped."
              exit 1
            fi
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning title=Temporary signing key::The HAMYAR_KEYSTORE secrets are not set, so this APK uses a one-time key. It installs fine, but a later APK will not install over it (export your data, uninstall, then install)."
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 -alias hamyar -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Hamyar"
          fi
          {
            echo "HAMYAR_KEYSTORE_FILE=$KEYSTORE"
            echo "HAMYAR_KEYSTORE_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Build the Android app
        working-directory: ${{ env.SRC }}/android
        env:
          HAMYAR_VERSION_CODE: ${{ github.run_number }}
          HAMYAR_VERSION_NAME: 0.2.${{ github.run_number }}
        run: |
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/hamyar-ci.sh"
          # accept the Android SDK licences so Gradle may fetch any SDK part that is missing
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          chmod +x gradlew
          logged "Android build" ./gradlew assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error title=Android build::Gradle finished but app-release.apk was not produced."
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/hamyar.apk"

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/hamyar-ci.sh"
          logged "Publishing the release" gh release create "build-${{ github.run_number }}" hamyar.apk \
            --title "Hamyar ${{ github.run_number }}" \
            --notes "Android: download hamyar.apk on the phone and install it. iPhone: open https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ in Safari and choose Add to Home Screen." \
            --latest
          {
            echo "### Hamyar for Android"
            echo "Open this address on the phone to download the app:"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/hamyar.apk"
          } >> "$GITHUB_STEP_SUMMARY"
